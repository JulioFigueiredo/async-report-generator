services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      - redis
    volumes:
      - report_files:/tmp/reports

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: ../.env
    depends_on:
      - redis
    volumes:
      - report_files:/tmp/reports

  redis:
    image: redis:7-alpine

volumes:
  report_files:
